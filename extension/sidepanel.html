<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocPat</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header id="header">
    <div class="header-left">
      <h1>DocPat</h1>
      <button id="session-toggle" class="session-toggle" title="Switch document">
        <span id="doc-title" class="doc-title"></span>
        <svg class="chevron" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5">
          <polyline points="2,3.5 5,6.5 8,3.5"></polyline>
        </svg>
      </button>
      <div id="sessions-dropdown" class="sessions-dropdown hidden"></div>
    </div>
    <div class="header-right">
      <button id="clear-btn" class="icon-btn" title="Clear chat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
        </svg>
      </button>
      <div id="status" class="status status-disconnected" title="Disconnected"></div>
    </div>
  </header>

  <main id="messages" class="messages"></main>

  <div id="tool-indicator" class="tool-indicator hidden"></div>

  <footer>
    <div id="skills-menu" class="skills-menu hidden"></div>
    <div class="input-wrapper">
      <textarea
        id="input"
        placeholder="Ask about docs, emails... (type / for skills)"
        rows="1"
        autofocus
      ></textarea>
      <button id="send-btn" title="Send (Enter)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div id="cost" class="cost"></div>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
